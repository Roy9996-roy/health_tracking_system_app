{% extends "base.html" %}
{% block title %}Log In - HealthTrack{% endblock %}
{% block content %}
<div class="auth-card">
    <h1>HealthTrack</h1>
    <p class="subtitle">Log in to your health dashboard</p>
    <form method="POST">
        <label>Email</label>
        <input type="email" name="email" required autofocus>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit" class="btn-primary">Log In</button>
    </form>
    <p class="switch-auth">No account? <a href="{{ url_for('register') }}">Register here</a></p>
</div>
{% endblock %}
